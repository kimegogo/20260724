    // Real ROC (Taiwan) ID Checksum Algorithm
    const validateTaiwanID = (id) => {
      if (!id || typeof id !== 'string') return { valid: false, message: '請輸入身分證字號' };
      const str = id.trim().toUpperCase();
      if (!/^[A-Z][1289]\d{8}$/.test(str)) {
        return { valid: false, message: '格式不符 (字母+9位數字，性別碼為1, 2, 8, 9)' };
      }

      const letterMap = {
        A:10, B:11, C:12, D:13, E:14, F:15, G:16, H:17, I:34, J:18, K:19,
        L:20, M:21, N:22, O:35, P:23, Q:24, R:25, S:26, T:27, U:28, V:29,
        W:32, X:30, Y:31, Z:33
      };

      const code = letterMap[str[0]];
      const n1 = Math.floor(code / 10);
      const n2 = code % 10;

      let sum = n1 * 1 + n2 * 9;
      const multipliers = [8, 7, 6, 5, 4, 3, 2, 1, 1];
      
      for (let i = 0; i < 9; i++) {
        sum += parseInt(str[i + 1], 10) * multipliers[i];
      }

      const isValid = sum % 10 === 0;
      return {
        valid: isValid,
        message: isValid ? '身分證字號邏輯檢查正確' : '身分證字號檢查碼(Checksum)錯誤，請核對'
      };
    };

                <div className="flex justify-between items-center pt-6 border-t border-slate-100">
                  <button
                    onClick={() => setActiveStep(3)}
                    className="px-4 py-2 text-slate-600 hover:bg-slate-100 font-semibold rounded-xl text-sm transition"
                  >
                    上一步
                  </button>

                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => handleSaveStep(4)}
                      className="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl text-sm transition"
                    >
                      僅儲存草稿
                    </button>
                    <button
                      onClick={handleSubmitFinal}
                      className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-emerald-600/30 flex items-center gap-2"
                    >
                      <i data-lucide="send" className="w-4 h-4"></i>
                      確認並送出審核
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }


    // ==========================================
    // 3. HR ADMIN DASHBOARD MODULE
    // ==========================================

    function HRAdminDashboard({ employees, setEmployees, updateEmployeeData, showToast, logAction, auditLogs, aiApiKey }) {
      const [filterStatus, setFilterStatus] = React.useState('ALL');
      const [selectedEmp, setSelectedEmp] = React.useState(null);
      const [rejectReason, setRejectReason] = React.useState('');
      const [showRejectModal, setShowRejectModal] = React.useState(false);
      const [searchTerm, setSearchTerm] = React.useState('');
      const [activeTab, setActiveTab] = React.useState('OVERVIEW'); // 'OVERVIEW' or 'AUDIT_LOGS'

      React.useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Stats calculation
      const stats = React.useMemo(() => {
        const total = employees.length;
        const approved = employees.filter(e => e.formStatus === 'APPROVED').length;
        const pending = employees.filter(e => e.formStatus === 'SUBMITTED').length;
        const riskCount = employees.filter(e => e.aiAudit?.riskScore === 'MEDIUM' || e.aiAudit?.riskScore === 'HIGH').length;
        return { total, approved, pending, riskCount };
      }, [employees]);

      const filteredEmployees = employees.filter(e => {
        const matchStatus = filterStatus === 'ALL' || e.formStatus === filterStatus;
        const matchSearch = e.name.includes(searchTerm) || e.department.includes(searchTerm);
        return matchStatus && matchSearch;
      });

      const handleApprove = (emp) => {
        updateEmployeeData(emp.id, { formStatus: 'APPROVED' });
        logAction('HR 管理員', `核准入職資料庫並發送系統 Hook`, emp.name);
        showToast(`已成功核准 ${emp.name} 的資料！系統已發送 API 通知薪資與門禁系統`, 'success');
        setSelectedEmp(null);
      };

      const handleRejectSubmit = () => {
        if (!selectedEmp) return;
        updateEmployeeData(selectedEmp.id, { formStatus: 'REJECTED' });
        logAction('HR 管理員', `退回入職資料 (原因: ${rejectReason})`, selectedEmp.name);
        showToast(`已退回 ${selectedEmp.name} 的表單，通知信件已自動寄出`, 'error');
        setShowRejectModal(false);
        setSelectedEmp(null);
        setRejectReason('');
      };

      return (
        <div className="space-y-6">
          {/* HR Top Navigation */}
          <div className="flex items-center justify-between border-b border-slate-200 pb-4">
            <div className="flex items-center space-x-4">
              <button
                onClick={() => setActiveTab('OVERVIEW')}
                className={`px-4 py-2 rounded-xl font-bold text-sm transition flex items-center gap-2 ${
                  activeTab === 'OVERVIEW' ? 'bg-slate-900 text-white shadow' : 'text-slate-600 hover:bg-slate-200'
                }`}
              >
                <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                入職看板與 AI 審核
              </button>
              <button
                onClick={() => setActiveTab('AUDIT_LOGS')}
                className={`px-4 py-2 rounded-xl font-bold text-sm transition flex items-center gap-2 ${
                  activeTab === 'AUDIT_LOGS' ? 'bg-slate-900 text-white shadow' : 'text-slate-600 hover:bg-slate-200'
                }`}
              >
                <i data-lucide="history" className="w-4 h-4"></i>
                系統稽核日誌 (Audit Logs)
              </button>
            </div>
          </div>

          {activeTab === 'OVERVIEW' ? (
            <>
              {/* Stats Grid */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                  <div>
                    <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">本月預計報到</p>
                    <h3 className="text-2xl font-black text-slate-800 mt-1">{stats.total} 人</h3>
                  </div>
                  <div className="w-10 h-10 bg-sky-50 text-sky-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="users" className="w-5 h-5"></i>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                  <div>
                    <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">待 HR 智慧審核</p>
                    <h3 className="text-2xl font-black text-amber-600 mt-1">{stats.pending} 人</h3>
                  </div>
                  <div className="w-10 h-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="clock" className="w-5 h-5"></i>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                  <div>
                    <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">已核准入職</p>
                    <h3 className="text-2xl font-black text-emerald-600 mt-1">{stats.approved} 人</h3>
                  </div>
                  <div className="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="check-circle" className="w-5 h-5"></i>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                  <div>
                    <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">AI 預警提示</p>
                    <h3 className="text-2xl font-black text-rose-600 mt-1">{stats.riskCount} 件</h3>
                  </div>
                  <div className="w-10 h-10 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="alert-triangle" className="w-5 h-5"></i>
                  </div>
                </div>
              </div>

              {/* Filter and Search Bar */}
              <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
                {/* Status Badges Filter */}
                <div className="flex flex-wrap items-center gap-1.5 w-full md:w-auto">
                  {[
                    { id: 'ALL', label: '全部' },
                    { id: 'SUBMITTED', label: '待審核' },
                    { id: 'IN_PROGRESS', label: '填寫中' },
                    { id: 'APPROVED', label: '已核准' },
                    { id: 'REJECTED', label: '退回修正' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setFilterStatus(tab.id)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                        filterStatus === tab.id
                          ? 'bg-sky-600 text-white shadow'
                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {/* Search box */}
                <div className="relative w-full md:w-64">
                  <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                  <input
                    type="text"
                    placeholder="搜尋姓名或部門..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full pl-9 pr-3 py-1.5 text-xs border border-slate-200 rounded-xl outline-none focus:border-sky-500 bg-slate-50/50"
                  />
                </div>
              </div>

              {/* Employee Table */}
              <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 border-b border-slate-100 text-slate-500 font-bold uppercase tracking-wider">
                      <tr>
                        <th className="p-4">新人姓名 / Email</th>
                        <th className="p-4">部門與職稱</th>
                        <th className="p-4">預計報到日</th>
                        <th className="p-4">填寫進度</th>
                        <th className="p-4">AI 審核風險評估</th>
                        <th className="p-4">狀態</th>
                        <th className="p-4 text-right">操作選項</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 text-slate-700">
                      {filteredEmployees.map(emp => (
                        <tr key={emp.id} className="hover:bg-slate-50/80 transition">
                          <td className="p-4 font-bold text-slate-900">
                            <div>{emp.name}</div>
                            <div className="text-[11px] font-normal text-slate-400">{emp.email}</div>
                          </td>
                          <td className="p-4">
                            <div>{emp.department}</div>
                            <div className="text-[11px] text-slate-400">{emp.jobTitle}</div>
                          </td>
                          <td className="p-4 font-medium">{emp.startDate}</td>
                          <td className="p-4">
                            <div className="flex items-center gap-2">
                              <div className="w-16 bg-slate-100 h-2 rounded-full overflow-hidden">
                                <div className="bg-sky-500 h-full" style={{ width: `${emp.completionRate}%` }}></div>
                              </div>
                              <span className="font-bold text-slate-600">{emp.completionRate}%</span>
                            </div>
                          </td>
                          <td className="p-4">
                            {emp.aiAudit ? (
                              <span className={`px-2.5 py-1 rounded-full font-bold text-[10px] inline-flex items-center gap-1 ${
                                emp.aiAudit.riskScore === 'MEDIUM' ? 'bg-amber-100 text-amber-800 border border-amber-200' :
                                emp.aiAudit.riskScore === 'HIGH' ? 'bg-rose-100 text-rose-800 border border-rose-200' :
                                'bg-emerald-100 text-emerald-800 border border-emerald-200'
                              }`}>
                                <i data-lucide={emp.aiAudit.riskScore === 'MEDIUM' ? 'alert-circle' : 'check'} className="w-3 h-3"></i>
                                {emp.aiAudit.riskScore === 'MEDIUM' ? 'AI 警示 (需人工核對)' : '通過 AI 檢核'}
                              </span>
                            ) : (
                              <span className="text-slate-400">尚未送審</span>
                            )}
                          </td>
                          <td className="p-4">
                            <span className={`px-2.5 py-1 rounded-md font-bold text-[10px] ${
                              emp.formStatus === 'APPROVED' ? 'bg-emerald-100 text-emerald-700' :
                              emp.formStatus === 'SUBMITTED' ? 'bg-amber-100 text-amber-700' :
                              emp.formStatus === 'REJECTED' ? 'bg-rose-100 text-rose-700' :
                              'bg-slate-100 text-slate-600'
                            }`}>
                              {emp.formStatus === 'APPROVED' ? '已核准' :
                               emp.formStatus === 'SUBMITTED' ? '待審核' :
                               emp.formStatus === 'REJECTED' ? '退回修正' : '填寫中'}
                            </span>
                          </td>
                          <td className="p-4 text-right">
                            <button
                              onClick={() => setSelectedEmp(emp)}
                              className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg font-bold text-xs transition"
                            >
                              檢視與審核
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </>
          ) : (
            /* Audit Log View */
            <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
              <h3 className="font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="shield-check" className="w-5 h-5 text-sky-600"></i>
                合規性與系統變更稽核軌跡 (Audit Trail)
              </h3>
              <div className="divide-y divide-slate-100 border border-slate-100 rounded-xl overflow-hidden text-xs">
                {auditLogs.map((log, idx) => (
                  <div key={idx} className="p-3.5 hover:bg-slate-50 flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                      <span className="font-mono text-slate-400">{log.time}</span>
                      <span className="font-bold text-slate-800 bg-slate-100 px-2 py-0.5 rounded">{log.user}</span>
                      <span className="text-slate-700">{log.action}</span>
                    </div>
                    <span className="text-slate-500 font-medium">{log.target}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Detailed Review Drawer Modal */}
          {selectedEmp && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-end">
              <div className="bg-white w-full max-w-2xl h-full shadow-2xl flex flex-col p-6 overflow-y-auto custom-scrollbar">
                {/* Modal Header */}
                <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">審核新人資料卡：{selectedEmp.name}</h3>
                    <p className="text-xs text-slate-500">{selectedEmp.department}・{selectedEmp.jobTitle}</p>
                  </div>
                  <button onClick={() => setSelectedEmp(null)} className="p-2 text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                {/* AI Review Smart Summary Panel */}
                <div className="my-4 bg-sky-50/70 border border-sky-200 p-4 rounded-2xl space-y-2">
                  <div className="flex items-center justify-between">
                    <h4 className="text-xs font-bold text-sky-900 flex items-center gap-1.5">
                      <i data-lucide="sparkles" className="w-4 h-4 text-sky-600"></i>
                      AI 智慧核對分析報告
                    </h4>
                    <span className="text-[10px] font-mono text-sky-700">Realtime Rule Verification Engine</span>
                  </div>

                  {selectedEmp.aiAudit?.issues?.map((issue, i) => (
                    <div key={i} className={`p-2.5 rounded-xl text-xs flex items-start gap-2 ${
                      issue.type === 'WARNING' ? 'bg-amber-100/80 text-amber-900 border border-amber-200' : 'bg-emerald-100/80 text-emerald-900 border border-emerald-200'
                    }`}>
                      <i data-lucide={issue.type === 'WARNING' ? 'alert-triangle' : 'check-circle-2'} className="w-4 h-4 mt-0.5 shrink-0"></i>
                      <span>{issue.message}</span>
                    </div>
                  ))}
                </div>

                {/* Main Data Breakdown */}
                <div className="space-y-6 flex-1 text-xs">
                  {/* Basic Info */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                    <h5 className="font-bold text-slate-800 text-sm border-b pb-1">1. 基本身分資料</h5>
                    <div className="grid grid-cols-2 gap-2 text-slate-600">
                      <div>身分證字號：<span className="font-bold text-slate-900">{selectedEmp.basicInfo?.idNumber || '未填'}</span></div>
                      <div>出生日期：<span className="font-bold text-slate-900">{selectedEmp.basicInfo?.birthday || '未填'}</span></div>
                      <div>電話：<span className="font-bold text-slate-900">{selectedEmp.basicInfo?.phone || '未填'}</span></div>
                      <div>地址：<span className="font-bold text-slate-900">{selectedEmp.basicInfo?.address || '未填'}</span></div>
                      <div>緊急聯絡人：<span className="font-bold text-slate-900">{selectedEmp.basicInfo?.emergencyContact || '未填'}</span></div>
                      <div>緊急電話：<span className="font-bold text-slate-900">{selectedEmp.basicInfo?.emergencyPhone || '未填'}</span></div>
                    </div>
                  </div>

                  {/* Bank Info */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                    <h5 className="font-bold text-slate-800 text-sm border-b pb-1">2. 銀行帳戶資料</h5>
                    <div className="grid grid-cols-2 gap-2 text-slate-600">
                      <div>銀行名稱：<span className="font-bold text-slate-900">{selectedEmp.bankInfo?.bankName || '未填'} ({selectedEmp.bankInfo?.bankCode})</span></div>
                      <div>分行：<span className="font-bold text-slate-900">{selectedEmp.bankInfo?.branchName || '未填'}</span></div>
                      <div className="col-span-2">存摺號碼：<span className="font-mono font-bold text-slate-900">{selectedEmp.bankInfo?.accountNumber || '未填'}</span></div>
                    </div>
                  </div>

                  {/* Education Info */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                    <h5 className="font-bold text-slate-800 text-sm border-b pb-1">3. 學歷與檔案</h5>
                    <div className="grid grid-cols-2 gap-2 text-slate-600">
                      <div>畢業學校：<span className="font-bold text-slate-900">{selectedEmp.educationInfo?.school || '未填'}</span></div>
                      <div>科系：<span className="font-bold text-slate-900">{selectedEmp.educationInfo?.department || '未填'}</span></div>
                      <div>學歷：<span className="font-bold text-slate-900">{selectedEmp.educationInfo?.highestDegree || '未填'}</span></div>
                      <div>檔名：<span className="font-mono text-sky-600">{selectedEmp.educationInfo?.certificateUrl || '未上傳'}</span></div>
                    </div>
                  </div>
                </div>

                {/* Bottom Action Footer */}
                <div className="border-t border-slate-200 pt-4 mt-6 flex items-center justify-between">
                  <button
                    onClick={() => setShowRejectModal(true)}
                    className="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl text-xs transition"
                  >
                    退回修正
                  </button>
                  <div className="flex gap-2">
                    <button
                      onClick={() => handleApprove(selectedEmp)}
                      className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-emerald-600/20 flex items-center gap-2"
                    >
                      <i data-lucide="check-circle-2" className="w-4 h-4"></i>
                      核准並發送各系統
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Rejection Reason Modal */}
          {showRejectModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                <h3 className="text-base font-bold text-slate-800">退回入職表單</h3>
                <p className="text-xs text-slate-500">請填寫退回原因，系統將寄發 Email 通知員工重新登入修改。</p>
                <textarea
                  value={rejectReason}
                  onChange={(e) => setRejectReason(e.target.value)}
                  placeholder="例：身分證字號數字有誤，請上傳正反面照片重新核對..."
                  className="w-full p-3 text-xs border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-rose-500 h-24"
                ></textarea>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setShowRejectModal(false)} className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">
                    取消
                  </button>
                  <button onClick={handleRejectSubmit} className="px-4 py-2 text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white rounded-lg">
                    發送退回通知
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }


    // Mount App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
