    // Safe React Icon wrapper that prevents Lucide from mutating React Virtual DOM directly
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const spanRef = React.useRef(null);

      React.useEffect(() => {
        if (!spanRef.current || !window.lucide) return;
        try {
          const pascalName = name
            .split('-')
            .map(part => part.charAt(0).toUpperCase() + part.slice(1))
            .join('');

          const iconDef = window.lucide.icons?.[pascalName] || window.lucide.icons?.[name];
          if (iconDef && window.lucide.createElement) {
            const svg = window.lucide.createElement(iconDef);
            svg.setAttribute('class', className);
            spanRef.current.innerHTML = '';
            spanRef.current.appendChild(svg);
          } else if (window.lucide.createIcons) {
            spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
            window.lucide.createIcons({
              nameAttr: 'data-lucide',
              icons: window.lucide.icons,
              root: spanRef.current
            });
          }
        } catch (e) {
          console.warn('Icon render fallback:', e);
        }
      }, [name, className]);

      return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
    };

    // Client-side Image Compression utility
    const compressImage = (file, maxWidth = 1600, maxHeight = 1600, quality = 0.8) => {
      return new Promise((resolve, reject) => {
        if (!file.type || !file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = (err) => reject(new Error('讀取檔案失敗'));
          reader.readAsDataURL(file);
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth || height > maxHeight) {
              if (width / height > maxWidth / maxHeight) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              } else {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve(dataUrl);
          };
          img.onerror = () => reject(new Error('圖片格式不支援或檔案毀損'));
          img.src = e.target.result;
        };
        reader.onerror = (err) => reject(new Error('無法讀取圖片檔案'));
        reader.readAsDataURL(file);
      });
    };

    // Real ROC (Taiwan) ID Checksum Algorithm
    const validateTaiwanID = (id) => {
      if (!id || typeof id !== 'string') return { valid: false, message: '請輸入身分證字號' };
      const str = id.trim().toUpperCase();
      if (!/^[A-Z][1289]\d{8}$/.test(str)) {
        return { valid: false, message: '格式不符 (首字英文字母+9位數字，性別碼為1, 2, 8, 9)' };
      }

      const letterMap = {
        A:10, B:11, C:12, D:13, E:14, F:15, G:16, H:17, I:34, J:18, K:19,
        L:20, M:21, N:22, O:35, P:23, Q:24, R:25, S:26, T:27, U:28, V:29,
        W:32, X:30, Y:31, Z:33
      };

      const code = letterMap[str[0]];
      const n1 = Math.floor(code / 10);
      const n2 = code % 10;

      let sum = n1 * 1 + n2 * 9;
      const multipliers = [8, 7, 6, 5, 4, 3, 2, 1, 1];
      
      for (let i = 0; i < 9; i++) {
        sum += parseInt(str[i + 1], 10) * multipliers[i];
      }

      const isValid = sum % 10 === 0;
      return {
        valid: isValid,
        message: isValid ? '身分證字號邏輯校驗正確' : '身分證字號檢查碼 (Checksum) 不相符，請核對'
      };
    };

    // Multi-Provider AI Vision API Caller (Supports NVIDIA NIM & Google Gemini)
    async function callAiVisionApi({ apiKey, base64Data, mimeType, prompt }) {
      const key = apiKey.trim();
      const isNvidia = key.startsWith('nvapi-');

      if (isNvidia) {
        try {
          const response = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${key}`
            },
            body: JSON.stringify({
              model: 'meta/llama-3.2-11b-vision-instruct',
              messages: [
                {
                  role: 'user',
                  content: [
                    { type: 'text', text: prompt },
                    {
                      type: 'image_url',
                      image_url: { url: `data:${mimeType};base64,${base64Data}` }
                    }
                  ]
                }
              ],
              temperature: 0.1,
              max_tokens: 1024
            })
          });

          if (!response.ok) {
            const errJson = await response.json().catch(() => ({}));
            throw new Error(errJson.detail || errJson.message || `NVIDIA API 呼叫失敗 (HTTP ${response.status})`);
          }

          const result = await response.json();
          return {
            providerName: 'NVIDIA NIM Vision AI',
            text: result.choices?.[0]?.message?.content || ''
          };
        } catch (err) {
          if (err.message && (err.message.includes('fetch') || err.name === 'TypeError')) {
            throw new Error('CORS_RESTRICTED');
          }
          throw err;
        }
      } else {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: prompt },
                  { inline_data: { mime_type: mimeType, data: base64Data } }
                ]
              }]
            })
          });

          if (!response.ok) {
            const errJson = await response.json().catch(() => ({}));
            throw new Error(errJson.error?.message || `Gemini API 呼叫失敗 (HTTP ${response.status})`);
          }

          const result = await response.json();
          return {
            providerName: 'Google Gemini Vision AI',
            text: result.candidates?.[0]?.content?.parts?.[0]?.text || ''
          };
        } catch (err) {
          if (err.message && (err.message.includes('fetch') || err.name === 'TypeError')) {
            throw new Error('CORS_RESTRICTED');
          }
          throw err;
        }
      }
    }

    // ErrorBoundary to catch unexpected React render errors
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an error:", error, errorInfo);
      }

        if (this.state.hasError) {
          return (

    function EmployeePortal({ employee, employees, setCurrentEmpId, activeStep, setActiveStep, updateEmployeeData, showToast, logAction, aiApiKey }) {
      const [basicForm, setBasicForm] = React.useState(employee.basicInfo || {
        idNumber: '', birthday: '', phone: '', address: '', emergencyContact: '', emergencyPhone: ''
      });
      const [bankForm, setBankForm] = React.useState(employee.bankInfo || {
        bankCode: '822', bankName: '中國信託商業銀行', branchName: '總行營業部', accountNumber: ''
      });
      const [eduForm, setEduForm] = React.useState(employee.educationInfo || {
        highestDegree: '大學', school: '', department: '', graduateYear: '2022', certificateUrl: ''
      });
      const [healthForm, setHealthForm] = React.useState(employee.healthInfo || {
        hasDependent: false, dependents: []
      });

      const [isAnalyzing, setIsAnalyzing] = React.useState(false);
      const [scannedDocName, setScannedDocName] = React.useState('');

      React.useEffect(() => {
        setBasicForm(employee.basicInfo || { idNumber: '', birthday: '', phone: '', address: '', emergencyContact: '', emergencyPhone: '' });
        setBankForm(employee.bankInfo || { bankCode: '822', bankName: '中國信託商業銀行', branchName: '總行營業部', accountNumber: '' });
        setEduForm(employee.educationInfo || { highestDegree: '大學', school: '', department: '', graduateYear: '2022', certificateUrl: '' });
        setHealthForm(employee.healthInfo || { hasDependent: false, dependents: [] });
      }, [employee.id]);

      const idValidationResult = React.useMemo(() => {
        if (!basicForm.idNumber) return null;
        return validateTaiwanID(basicForm.idNumber);
      }, [basicForm.idNumber]);

      const handleSaveStep = (stepNumber) => {
        let updatedData = {};
        if (stepNumber === 1) {
          if (idValidationResult && !idValidationResult.valid) {
            showToast('請注意：身分證字號檢查碼不完全正確，但仍為您存檔', 'error');
          }
          updatedData = { basicInfo: basicForm };
        } else if (stepNumber === 2) {
          updatedData = { bankInfo: bankForm };
        } else if (stepNumber === 3) {
          updatedData = { educationInfo: eduForm };
        } else if (stepNumber === 4) {
          updatedData = { healthInfo: healthForm };
        }

        updateEmployeeData(employee.id, {
          ...updatedData,
          formStatus: employee.formStatus === 'NOT_STARTED' ? 'IN_PROGRESS' : employee.formStatus
        });

        logAction(employee.name, `儲存步驟 ${stepNumber} 資料`, '個人暫存檔');
        showToast(`步驟 ${stepNumber} 資料已儲存！`, 'success');
      };

      const handleFileUploadSim = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsAnalyzing(true);
        setScannedDocName(file.name);

        try {
          const compressedBase64 = await compressImage(file, 1600, 1600, 0.8);
          const base64Data = compressedBase64.split(',')[1];
          const mimeType = 'image/jpeg';

          if (aiApiKey) {
            const prompt = `你是一個專業的人資證件審核 AI。請讀取這張畢業證書或學歷證明圖片，並以純 JSON 格式傳回以下資訊（不要包含 markdown 標籤或加粗文字）：
{
  "school": "學校名稱",
  "department": "科系名稱",
  "graduateYear": "畢業年份 (例如 2021)",
  "highestDegree": "學士 或 碩士 或 博士 或 副學士"
}`;

            const res = await callAiVisionApi({
              apiKey: aiApiKey,
              base64Data,
              mimeType,
              prompt
            });

            const cleanJson = res.text.replace(/```json/g, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(cleanJson);

            setEduForm(prev => ({
              ...prev,
              school: parsed.school || prev.school,
              department: parsed.department || prev.department,
              graduateYear: parsed.graduateYear || prev.graduateYear,
              highestDegree: parsed.highestDegree || prev.highestDegree,
              certificateUrl: file.name
            }));

            showToast(`✨ [${res.providerName}] 視覺辨識成功！已帶入學歷`, 'success');
            logAction(employee.name, `${res.providerName} OCR 辨識學歷`, file.name);
          } else {
            setTimeout(() => {
              setEduForm(prev => ({
                ...prev,
                school: '國立政治大學',
                department: '企業管理學系',
                graduateYear: '2021',
                highestDegree: '學士',
                certificateUrl: file.name
              }));
              showToast('💡 提示：輸入 AI Key 可啟用真實 AI 辨識 (目前使用模擬預設值)', 'info');
            }, 1200);
          }
        } catch (err) {
          console.error('OCR Error:', err);
          showToast(`辨識失敗: ${err.message}`, 'error');
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleSubmitFinal = () => {
        if (!basicForm.idNumber || !bankForm.accountNumber || !eduForm.school) {
          showToast('請完整填寫前 3 個步驟的主要欄位後再送出', 'error');
          return;
        }

        const issues = [];
        if (idValidationResult && !idValidationResult.valid) {
          issues.push({ type: 'WARNING', field: 'idNumber', message: idValidationResult.message });
        } else {
          issues.push({ type: 'OK', field: 'idNumber', message: '身分證號經演算法校驗無誤' });
        }

        if (bankForm.accountNumber.length < 10) {
          issues.push({ type: 'WARNING', field: 'accountNumber', message: '銀行帳號位數過短 (一般為10-14位)' });
        } else {
          issues.push({ type: 'OK', field: 'accountNumber', message: '銀行代碼與帳號格式相符' });
        }

        const riskScore = issues.some(i => i.type === 'WARNING') ? 'MEDIUM' : 'LOW';

        updateEmployeeData(employee.id, {
          basicInfo: basicForm,
          bankInfo: bankForm,
          educationInfo: eduForm,
          healthInfo: healthForm,
          formStatus: 'SUBMITTED',
          completionRate: 100,
          aiAudit: { riskScore, issues }
        });

        logAction(employee.name, '正式送出入職資料', 'HR審核佇列');
        showToast('🎉 資料已成功送出！HR 正在線上進行智慧核對。', 'success');
      };

      return (
        <div className="space-y-6">
          {/* Employee Switcher Banner */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 bg-sky-100 text-sky-700 font-bold rounded-2xl flex items-center justify-center text-lg shadow-inner">
                {employee.name[0]}
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h2 className="text-lg font-bold text-slate-800">{employee.name}</h2>
                  <span className="text-xs px-2.5 py-0.5 rounded-full font-medium bg-slate-100 text-slate-600 border border-slate-200">
                    {employee.department}・{employee.jobTitle}
                  </span>
                </div>
                <p className="text-xs text-slate-500 mt-0.5">
                  預計報到日：<span className="font-semibold text-slate-700">{employee.startDate}</span>
                  <span className="ml-2 font-mono text-[10px] text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200">
                    [{employee.sourceNote || '線上自助填寫'}]
                  </span>
                </p>
              </div>
            </div>

            <div className="flex items-center gap-2 text-xs text-slate-500 self-end md:self-center">
              <span>切換測試員工：</span>
              <select
                value={employee.id}
                onChange={(e) => setCurrentEmpId(e.target.value)}
                className="bg-slate-50 border border-slate-300 text-slate-800 font-medium py-1.5 px-3 rounded-lg outline-none focus:ring-2 focus:ring-sky-500"
              >
                {employees.map(e => (
                  <option key={e.id} value={e.id}>{e.name} ({e.department}) - 狀態: {e.formStatus}</option>
                ))}
              </select>
            </div>
          </div>

          {/* Progress Overview */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
            <div className="flex items-center justify-between mb-3">
              <div>
                <h3 className="text-sm font-bold text-slate-800">入職資料校對與填寫進度</h3>
                <p className="text-xs text-slate-500">若是由紙本掃描帶入，請核對以下欄位是否精確無誤</p>
              </div>
              <span className="text-2xl font-black text-sky-600">{employee.completionRate}%</span>
            </div>
            <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
              <div className="bg-sky-500 h-full transition-all duration-500 rounded-full" style={{ width: `${employee.completionRate}%` }}></div>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6">
              {[
                { step: 1, title: '1. 基本資料', icon: 'user', done: !!employee.basicInfo?.idNumber },
                { step: 2, title: '2. 銀行帳戶', icon: 'building-2', done: !!employee.bankInfo?.accountNumber },
                { step: 3, title: '3. 學歷與附件', icon: 'graduation-cap', done: !!employee.educationInfo?.school },
                { step: 4, title: '4. 眷屬投保', icon: 'heart-handshake', done: !!employee.healthInfo }
              ].map(s => (
                <button
                  key={s.step}
                  onClick={() => setActiveStep(s.step)}
                  className={`p-3 rounded-xl border text-left transition flex items-center gap-3 ${
                    activeStep === s.step
                      ? 'border-sky-500 bg-sky-50/50 ring-2 ring-sky-500/20'
                      : 'border-slate-200 hover:border-slate-300 bg-slate-50/50'
                  }`}
                >
                  <div className={`p-2 rounded-lg ${s.done ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}`}>
                    <Icon name={s.done ? 'check-circle-2' : s.icon} className="w-4 h-4" />
                  </div>
                  <div>
                    <div className="text-xs font-bold text-slate-800">{s.title}</div>
                    <div className="text-[10px] text-slate-500">{s.done ? '已儲存' : '未完成'}</div>
                  </div>
                </button>
              ))}
            </div>
          </div>

          {/* Form Step Body */}
          <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
            {activeStep === 1 && (
              <div className="space-y-4">
                <div className="border-b border-slate-100 pb-3 flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <Icon name="user" className="w-5 h-5 text-sky-600" />
                    個人基本資料
                  </h3>
                  <span className="text-xs text-sky-600 bg-sky-50 px-2.5 py-1 rounded-md font-medium">實時 AI 邏輯校驗</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">身分證字號 *</label>
                    <input
                      type="text"
                      maxLength={10}
                      value={basicForm.idNumber}
                      onChange={(e) => setBasicForm({ ...basicForm, idNumber: e.target.value.toUpperCase() })}
                      className={`w-full px-3.5 py-2 text-sm border rounded-xl outline-none transition ${
                        idValidationResult
                          ? idValidationResult.valid
                            ? 'border-emerald-500 bg-emerald-50/30'
                            : 'border-rose-400 bg-rose-50/30'
                          : 'border-slate-200 focus:border-sky-500'
                      }`}
                      placeholder="例：A123456789"
                    />
                    {idValidationResult && (
                      <p className={`text-[11px] mt-1 flex items-center gap-1 ${idValidationResult.valid ? 'text-emerald-600' : 'text-rose-600'}`}>
                        <Icon name={idValidationResult.valid ? 'check' : 'alert-circle'} className="w-3.5 h-3.5" />
                        {idValidationResult.message}
                      </p>
                    )}
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">出生年月日</label>
                    <input
                      type="date"
                      value={basicForm.birthday}
                      onChange={(e) => setBasicForm({ ...basicForm, birthday: e.target.value })}
                      className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:border-sky-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">聯絡電話</label>
                    <input
                      type="text"
                      value={basicForm.phone}
                      onChange={(e) => setBasicForm({ ...basicForm, phone: e.target.value })}
                      className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:border-sky-500"
                      placeholder="0912-345-678"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">通訊地址</label>
                    <input
                      type="text"
                      value={basicForm.address}
                      onChange={(e) => setBasicForm({ ...basicForm, address: e.target.value })}
                      className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:border-sky-500"
                      placeholder="縣市/區/路街門牌"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">緊急聯絡人姓名與關係</label>
                    <input
                      type="text"
                      value={basicForm.emergencyContact}
                      onChange={(e) => setBasicForm({ ...basicForm, emergencyContact: e.target.value })}
                      className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:border-sky-500"
                      placeholder="例：張小華 (父親)"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">緊急聯絡人電話</label>
                    <input
                      type="text"
                      value={basicForm.emergencyPhone}
                      onChange={(e) => setBasicForm({ ...basicForm, emergencyPhone: e.target.value })}
                      className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:border-sky-500"
                      placeholder="0911-222-333"
                    />
                  </div>
                </div>

                <div className="flex justify-between items-center pt-4">
                  <div></div>
                  <button
                    onClick={() => { handleSaveStep(1); setActiveStep(2); }}
                    className="px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl text-sm transition flex items-center gap-2"
                  >
                    儲存並下一步 <Icon name="arrow-right" className="w-4 h-4" />
                  </button>
                </div>
              </div>
            )}

            {activeStep === 2 && (
              <div className="space-y-4">
                <div className="border-b border-slate-100 pb-3 flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <Icon name="building-2" className="w-5 h-5 text-sky-600" />
                    薪務撥款銀行帳戶
                  </h3>
                  <span className="text-xs text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-md font-medium">台灣金融機構資料庫核對</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">金融機構名稱 (代碼)</label>
                    <select
                      value={bankForm.bankCode}
                      onChange={(e) => {
                        const selected = TAIWAN_BANKS.find(b => b.code === e.target.value);
                        setBankForm({
                          ...bankForm,
                          bankCode: e.target.value,
                          bankName: selected?.name || '',
                          branchName: selected?.branches[0] || ''
                        });
                      }}
                      className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:border-sky-500 bg-white"
                    >
                      {TAIWAN_BANKS.map(b => (

        return matchStatus && matchSearch;
      });

        setIsScanningPaper(true);
        setPaperScanFile(file);

        try {
          const compressedDataUrl = await compressImage(file, 1600, 1600, 0.85);
          setPaperScanPreview(compressedDataUrl);

          const base64Data = compressedDataUrl.split(',')[1];
          const mimeType = 'image/jpeg';

          if (aiApiKey) {
            const prompt = `你是一個極度精準的人資 AI 助手。請讀取這張紙本報到單/入職卡，並以純 JSON 格式傳回內容（請勿包含 Markdown 格式或額外說明）：
{
  "name": "姓名",
  "idNumber": "身分證字號",
  "department": "部門名稱",
  "jobTitle": "預定職稱",
  "birthday": "YYYY-MM-DD",
  "phone": "電話號碼",
  "address": "地址",
  "bankCode": "銀行3位代碼 (如 822)",
  "bankName": "銀行名稱",
  "accountNumber": "存摺號碼",
  "school": "畢業學校",
  "schoolDept": "畢業科系",
  "highestDegree": "學士 或 碩士 或 專科"
}`;

                apiKey: aiApiKey,
                base64Data,
                mimeType,
                prompt

                name: parsed.name || '新進員工',
                idNumber: parsed.idNumber || 'A100000000',
                department: parsed.department || '研發部',

                phone: parsed.phone || '0900-000-000',
                address: parsed.address || '台北市',
                bankCode: parsed.bankCode || '822',
                bankName: parsed.bankName || '中國信託商業銀行',
                accountNumber: parsed.accountNumber || '822000000000',
                school: parsed.school || '台灣大學',
                schoolDept: parsed.schoolDept || '資訊系',

                  <h4 className="text-xs font-bold text-sky-900 flex items-center gap-1.5">
                    <Icon name="sparkles" className="w-4 h-4 text-sky-600" />
                    AI 智慧核對分析報告
                  </h4>
                  {selectedEmp.aiAudit?.issues?.map((issue, i) => (
                    <div key={i} className={`p-2.5 rounded-xl text-xs flex items-start gap-2 ${
                      issue.type === 'WARNING' ? 'bg-amber-100/80 text-amber-900 border border-amber-200' : 'bg-emerald-100/80 text-emerald-900 border border-emerald-200'
                    }`}>
                      <Icon name={issue.type === 'WARNING' ? 'alert-triangle' : 'check-circle-2'} className="w-4 h-4 mt-0.5 shrink-0" />
                      <span>{issue.message}</span>
                    </div>
                  ))}
                </div>

                {/* Main Data Breakdown */}
                <div className="space-y-4 flex-1 text-xs">
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                    <h5 className="font-bold text-slate-800 text-sm border-b pb-1">1. 基本身分資料</h5>
                    <div className="grid grid-cols-2 gap-2 text-slate-600">
                      <div>身分證字號：<span className="font-bold text-slate-900">{selectedEmp.basicInfo?.idNumber || '未填'}</span></div>
                      <div>出生日期：<span className="font-bold text-slate-900">{selectedEmp.basicInfo?.birthday || '未填'}</span></div>
                      <div>電話：<span className="font-bold text-slate-900">{selectedEmp.basicInfo?.phone || '未填'}</span></div>
                      <div>地址：<span className="font-bold text-slate-900">{selectedEmp.basicInfo?.address || '未填'}</span></div>
                      <div>緊急聯絡人：<span className="font-bold text-slate-900">{selectedEmp.basicInfo?.emergencyContact || '未填'}</span></div>
                      <div>緊急電話：<span className="font-bold text-slate-900">{selectedEmp.basicInfo?.emergencyPhone || '未填'}</span></div>
                    </div>
                  </div>

                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                    <h5 className="font-bold text-slate-800 text-sm border-b pb-1">2. 銀行帳戶資料</h5>
                    <div className="grid grid-cols-2 gap-2 text-slate-600">
                      <div>銀行名稱：<span className="font-bold text-slate-900">{selectedEmp.bankInfo?.bankName || '未填'} ({selectedEmp.bankInfo?.bankCode})</span></div>
                      <div>分行：<span className="font-bold text-slate-900">{selectedEmp.bankInfo?.branchName || '未填'}</span></div>
                      <div className="col-span-2">存摺號碼：<span className="font-mono font-bold text-slate-900">{selectedEmp.bankInfo?.accountNumber || '未填'}</span></div>
                    </div>
                  </div>

                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                    <h5 className="font-bold text-slate-800 text-sm border-b pb-1">3. 學歷與檔案</h5>
                    <div className="grid grid-cols-2 gap-2 text-slate-600">
                      <div>畢業學校：<span className="font-bold text-slate-900">{selectedEmp.educationInfo?.school || '未填'}</span></div>
                      <div>科系：<span className="font-bold text-slate-900">{selectedEmp.educationInfo?.department || '未填'}</span></div>
                      <div>學歷：<span className="font-bold text-slate-900">{selectedEmp.educationInfo?.highestDegree || '未填'}</span></div>
                      <div>檔名：<span className="font-mono text-sky-600">{selectedEmp.educationInfo?.certificateUrl || '未上傳'}</span></div>
                    </div>
                  </div>
                </div>

                <div className="border-t border-slate-200 pt-4 mt-6 flex items-center justify-between">
                  <button
                    onClick={() => setShowRejectModal(true)}
                    className="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl text-xs transition"
                  >
                    退回修正
                  </button>
                  <button
                    onClick={() => handleApprove(selectedEmp)}
                    className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-emerald-600/20 flex items-center gap-2"
                  >
                    <Icon name="check-circle-2" className="w-4 h-4" />
                    核准正式生效
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Rejection Reason Modal */}
          {showRejectModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                <h3 className="text-base font-bold text-slate-800">退回入職表單</h3>
                <p className="text-xs text-slate-500">請填寫退回原因，系統將寄發 Email 通知員工重新登入修改。</p>
                <textarea
                  value={rejectReason}
                  onChange={(e) => setRejectReason(e.target.value)}
                  placeholder="例：身分證字號數字有誤，請上傳正反面照片重新核對..."
                  className="w-full p-3 text-xs border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-rose-500 h-24"
                ></textarea>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setShowRejectModal(false)} className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">
                    取消
                  </button>
                  <button onClick={handleRejectSubmit} className="px-4 py-2 text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white rounded-lg">
                    發送退回通知
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
